<script>

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function dday(){
 const t=new Date((S.dday.date||'')+'T00:00:00');if(isNaN(t))return null;
 const now=new Date();now.setHours(0,0,0,0);const diff=Math.round((now-t)/864e5),since=S.dday.mode!=='until';
 const lab=(since?'SINCE ':'UNTIL ')+S.dday.date.replace(/-/g,'.');
 if(since){const n=Math.abs(diff),sign=diff>=0?'D+':'D-';
  if(diff<0)return{p:sign,n,lab,sub:''};
  const next=Math.ceil((diff+1)/100)*100;return{p:'D+',n:diff,lab,sub:`<div class="dbar"><i style="width:${diff%100}%"></i></div><div class="dm"><span>다음 기념일 <b>D+${next}</b></span><span><b>D-${next-diff}</b></span></div>`}}

function pagePair(an){

  <div class="rw r3"><span class="n">1.</span><div class="c pc">${photo('chars.0.photo',U(c0))}<div class="pn">${T('chars.0.name','')}<span class="ch">▾</span></div></div><div class="c pc">${photo('chars.1.photo',U(c1))}<div class="pn">${T('chars.1.name','')}<span class="ch">▾</span></div></div></div>

function foot(an,n){

 const cp=`<span class="cp2">© ${esc(S.name)}<button class="lg" id="lg" aria-label="login">#</button></span>`;
 const row=n===1?cp+nav:nav+cp;
 return `<footer class="ft${a}">${row}</footer><div class="lgf${lgOpen&&!logged?' on':''}" id="lgf"><form class="ug" id="uf" autocomplete="off"><input type="email" placeholder="email" aria-label="email"><input type="password" placeholder="password" aria-label="password"><button aria-label="login">→</button></form><p class="er" id="er">${esc(lgErr)}</p></div>`}
function paint(an=false){
 document.body.classList.toggle('edit',editing);
 document.title='Nf3d6';
 $('#app').innerHTML=page===1?pageMe(an):pagePair(an);
}
function route(){page=/^#\/pair/.test(location.hash)?2:1;paint(true);window.scrollTo(0,0)}
function flash(m,ms=2500){$('#ebm').textContent=m;clearTimeout(ft);ft=setTimeout(()=>$('#ebm').textContent='EDIT MODE',ms)}

/* ---- load / save ---- */
async function load(){
 if(!sb)return;
 const r=await sb.from('site').select('data').eq('id',1).maybeSingle();
 if(r.error){console.error(r.error);return}
 const d=r.data&&r.data.data;
 if(d&&Object.keys(d).length)S={...DEF(),...d,dday:{...DEF().dday,...(d.dday||{})},guide:{...DEF().guide,...(d.guide||{})}};
}
async function save(){
 if(!sb){flash('DEMO — Supabase 미연결');return}
 flash('SAVING…',30000);
 try{
  const clean=JSON.parse(JSON.stringify(S));
  const r=await sb.from('site').upsert({id:1,data:clean,updated_at:new Date().toISOString()}).select();
  if(r.error)throw r.error;
  if(!r.data||!r.data.length)throw new Error('권한이 없어요(로그인을 확인해 주세요)');
  flash('SAVED ✓',3000);
 }catch(err){flash('FAILED: '+(err.message||err),6000)}
}

/* ---- events ---- */
const app=$('#app');
app.addEventListener('click',e=>{
 if(e.target.closest('#lg')){
  if(logged){editing=!editing;paint();return}
  lgOpen=!lgOpen;paint();if(lgOpen){const i=$('#lgf input');i&&i.focus()}return}
 const b=e.target.closest('[data-a]');
 if(b){const a=b.dataset.a,i=+b.dataset.i;
  if(a==='addabout')S.about.push({k:'KEY',v:'value'});
  else if(a==='rmabout')S.about.splice(i,1);
  else if(a==='addspec')S.spec.push({k:'KEY',v:['','']});
  else if(a==='rmspec')S.spec.splice(i,1);
  else if(a==='addnote')S.guide.notes.push('새 항목');
  else if(a==='rmnote')S.guide.notes.splice(i,1);
  else if(a==='ddmode')S.dday.mode=S.dday.mode==='until'?'since':'until';
  paint();return}
 if(editing)return;
 const rv=e.target.closest('[data-pin]');if(rv&&!e.target.closest('a'))rv.classList.toggle('pin');
});
app.addEventListener('input',e=>{
 const t=e.target,p=t.dataset&&t.dataset.p;if(!p||!t.isContentEditable)return;
 const txt=t.textContent;
 if(t.dataset.t==='list')setp(S,p,txt.split(/[,·]/).map(x=>x.trim()).filter(Boolean));else setp(S,p,txt);
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.isContentEditable){e.preventDefault();e.target.blur()}});
app.addEventListener('paste',e=>{if(e.target.isContentEditable){e.preventDefault();document.execCommand('insertText',false,(e.clipboardData.getData('text')||'').replace(/\s*\n+\s*/g,' '))}});
app.addEventListener('focusout',e=>{if(e.target.isContentEditable&&editing&&(e.target.dataset.p==='name'||e.target.dataset.p==='chars.0.name'||e.target.dataset.p==='chars.1.name'))paint()});
app.addEventListener('submit',async e=>{
 e.preventDefault();
 const [m,p]=[...e.target.querySelectorAll('input')],er=$('#er');
 if(!m.value||!p.value){er.textContent='Enter email and password';return}
 if(!sb){er.textContent='Supabase가 연결되지 않았어요';return}
 er.textContent='…';
 const {error}=await sb.auth.signInWithPassword({email:m.value.trim(),password:p.value});
 if(error){er.textContent='Login failed';return}
 logged=true;lgOpen=false;lgErr='';
 await load();editing=true;paint();
});
app.addEventListener('change',async e=>{
 const dd=e.target.closest('input[data-dd]');if(dd){S.dday.date=dd.value;paint();return}
 const i=e.target.closest('input[data-up]');if(!i||!i.files[0])return;
 const f=i.files[0],key=i.dataset.up;
 if(!f.type.startsWith('image/')){flash('이미지 파일만 올릴 수 있어요');return}
 if(f.size>5*1024*1024){flash('5MB 이하만 올릴 수 있어요');return}
 if(!sb){setp(S,key,URL.createObjectURL(f));paint();return}
 flash('UPLOADING…',20000);
 const ext=(f.name.split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,'')||'png';
 const path=`${key.replace(/\W+/g,'-')}-${Date.now()}.${ext}`;
 const {error}=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type,cacheControl:'3600'});
 if(error){flash('UPLOAD FAILED: '+error.message,6000);return}
 setp(S,key,sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl);
 paint();flash('UPLOADED — SAVE 를 눌러 적용');
});
$('#sv').onclick=save;
$('#ex').onclick=async()=>{S=DEF();await load();editing=false;paint()};
$('#lo').onclick=async()=>{if(sb)await sb.auth.signOut();logged=false;editing=false;S=DEF();await load();paint()};
window.addEventListener('hashchange',route);

/* ---- start ---- */
(async()=>{
 if(SB_URL&&SB_KEY&&window.supabase){
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  try{const {data:{session}}=await sb.auth.getSession();logged=!!session;await load()}catch(err){console.error(err)}
 }
 route();
})();
</script></body></html>
