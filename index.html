<style>

*{box-sizing:border-box;border-radius:0}

body{background:var(--bg);color:var(--fg);font:400 12.5px/1.6 var(--sans);letter-spacing:-.03em;-webkit-font-smoothing:antialiased;min-height:100vh}

  const t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();ok=true},{passive:true});

  if(!ok)return;ok=false;
  const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;

 const field=()=>{const s=getSelection();if(!live()||!s.rangeCount||s.isCollapsed)return null;const a=el(s.anchorNode),f=el(s.focusNode),m=a&&a.closest('.ml[data-md]');return m&&f&&f.closest('.ml[data-md]')===m?m:null};
 const txtOff=(root,node,off)=>{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n,c=0;while(n=w.nextNode()){if(n===node)return c+off;c+=n.nodeValue.length}return c};
 const setSel=(root,a,b)=>{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n,c=0,sn,so,en,eo;while(n=w.nextNode()){const l=n.nodeValue.length;if(sn===undefined&&a<=c+l){sn=n;so=a-c}if(en===undefined&&b<=c+l){en=n;eo=b-c;break}c+=l}if(sn&&en){const r=document.createRange();r.setStart(sn,so);r.setEnd(en,eo);const s=getSelection();s.removeAllRanges();s.addRange(r)}};
 const place=()=>{const m=field();if(!m){TB.hidden=true;TB.querySelector('.tbh').hidden=true;TB.querySelector('.thl').classList.remove('on');return}
  const r=getSelection().getRangeAt(0).getBoundingClientRect();TB.hidden=false;const w=TB.offsetWidth,h=TB.offsetHeight;let x=r.left+r.width/2-w/2,y=r.top-h-8;if(y<6)y=r.bottom+8;x=Math.max(6,Math.min(innerWidth-w-6,x));TB.style.left=x+'px';TB.style.top=y+'px'};
 const apply=(t,h)=>{const m=field();if(!m)return;const sel=getSelection(),txt=sel.toString();if(!txt)return;const rg=sel.getRangeAt(0),start=txtOff(m,rg.startContainer,rg.startOffset);let out=txt;
  const wrap=(a,b)=>txt.length>a.length+b.length&&txt.startsWith(a)&&txt.endsWith(b)?txt.slice(a.length,txt.length-b.length):a+txt+b;
  if(t==='b')out=wrap('**','**');
  else if(t==='i')out=(txt.length>2&&txt.startsWith('*')&&!txt.startsWith('**')&&txt.endsWith('*')&&!txt.endsWith('**'))?txt.slice(1,-1):'*'+txt+'*';
  else if(t==='s')out=wrap('~~','~~');
  else if(h!==undefined){const hm=/^==(?:\{([1-6])\})?([\s\S]+)==$/.exec(txt),inner=hm?hm[2]:txt;out=h===0?inner:'=='+(h>1?'{'+h+'}':'')+inner+'=='}
  else if(t==='a'){const u=prompt('Link URL','https://');if(!u)return;out='['+txt+']('+u+')'}
  else if(t==='q')out=txt.split('\n').map(l=>l.startsWith('> ')?l.slice(2):'> '+l).join('\n');
  else if(t==='l')out=txt.split('\n').map(l=>/^- /.test(l)?l.slice(2):'- '+l).join('\n');
  else if(t==='x')out=txt.replace(/\*\*|~~|==(?:\{[1-6]\})?/g,'').replace(/^(>|-)\s/gm,'');
  else return;
  document.execCommand('insertText',false,out);setSel(m,start,start+out.length);requestAnimationFrame(place)};
 TB.addEventListener('mousedown',e=>e.preventDefault());
 TB.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.h!==undefined){apply('hl',+b.dataset.h);return}if(b.dataset.t==='hl'){const h=TB.querySelector('.tbh');h.hidden=!h.hidden;b.classList.toggle('on',!h.hidden);requestAnimationFrame(place);return}apply(b.dataset.t)});
 document.addEventListener('selectionchange',()=>requestAnimationFrame(place));
 addEventListener('scroll',()=>{if(!TB.hidden)place()},{passive:true});addEventListener('resize',place);
 document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&!e.altKey&&field()){const k=e.key.toLowerCase();if(k==='b'||k==='i'){e.preventDefault();apply(k)}}});
})();

/* ---- block editing events (after app exists) ---- */
app.addEventListener('click',e=>{const b=e.target.closest('[data-bk]');if(!b||!live())return;
 const k=b.dataset.bk,pg=+b.dataset.pg,i=+b.dataset.bi,arr=S['b'+pg],blk=arr&&arr[i];
 if(k==='add'){const key=pg+':'+i;BUI.pal=BUI.pal===key?'':key;paint();return}
 if(k==='new'){const t=b.dataset.t;arr.splice(i,0,{t,v:0,d:BT[t].mk()});BUI.pal='';paint();return}
 if(!blk)return;
 if(k==='mv'){const j=i+ +b.dataset.d;if(j>=0&&j<arr.length){[arr[i],arr[j]]=[arr[j],arr[i]];BUI.gear=''}paint();return}
 if(k==='ds'){blk.v=((blk.v||0)+1)%BT[blk.t].v.length;paint();return}
 if(k==='dup'){arr.splice(i+1,0,JSON.parse(JSON.stringify(blk)));paint();return}
 if(k==='del'){arr.splice(i,1);BUI.gear='';paint();return}
 if(k==='gear'){const key=pg+':'+i;BUI.gear=BUI.gear===key?'':key;paint();return}
 if(k==='tab'){BUI.tab=b.dataset.t;paint();return}
 if(k==='clrd'){blk.d.srcD='';paint();return}
 if(k==='fx'){const r=b.getBoundingClientRect(),x=Math.round(Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100))),y=Math.round(Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100)));if(BUI.tab==='m'){blk.d.mfx=x;blk.d.mfy=y}else{blk.d.fx=x;blk.d.fy=y}paint();return}
 if(k==='radd'){const t=blk.t,rows=blk.d.rows=blk.d.rows||[];rows.push(t==='kv'?{k:'KEY',v:'value'}:t==='links'?{t:'Label',u:'https://'}:{t:'New',n:'Text',c:0});paint();return}
 if(k==='rdel'){blk.d.rows.splice(+b.dataset.r,1);paint();return}
 if(k==='rmv'){const r=+b.dataset.r,j=r+ +b.dataset.d,rows=blk.d.rows;if(j>=0&&j<rows.length)[rows[r],rows[j]]=[rows[j],rows[r]];paint();return}
 if(k==='ck'){const r=blk.d.rows[+b.dataset.r];r.c=r.c?0:1;paint();return}
});
app.addEventListener('input',e=>{const r=e.target.closest&&e.target.closest('input[data-bs]');if(!r)return;const pg=+r.dataset.pg,i=+r.dataset.bi,blk=(S['b'+pg]||[])[i];if(!blk)return;blk.d[r.dataset.bs]=+r.value;
 const im=r.closest('.blkx').querySelector('.bx-im');if(im){const d=blk.d;im.style.setProperty('--h',(d.h||260)+'px');im.style.setProperty('--mh',(d.mh||d.h||200)+'px')}const lb=r.previousElementSibling;if(lb&&lb.tagName==='LABEL'){const bb=lb.querySelector('b');if(bb)bb.textContent=r.value+'px'}});
</script></body></html>
