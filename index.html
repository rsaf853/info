 if(S.dday.mode!=='until'){
  if(diff<0)return{n:-diff,sub:''};
  const n100=Math.ceil((diff+1)/100)*100,n365=Math.ceil((diff+1)/365)*365,next=Math.min(n100,n365),prev=Math.max(Math.floor(diff/100)*100,Math.floor(diff/365)*365);
  return{n:diff,pct:Math.round((diff-prev)/(next-prev)*100),sub:`<div class="dm"><span>${T('dday.next','','span','NEXT')} <b>${unit(next)}</b></span><span><b>${unit(next-diff)}</b> left</span></div>`}}
 return{n:Math.abs(diff),sub:''}}
const U=s=>String(s||'').toUpperCase();
const nm=i=>S.chars[i].name||'';
const bandTxt=(p,auto)=>live()?`<span data-p="${p}" contenteditable="true">${esc(getp(S,p)||auto||'')}</span>`:`<span>${esc(getp(S,p)||auto||'')}</span>`;

/* ---- pages ---- */
function pageMe(an){
 const a=i=>an?` a" style="--i:${i}`:'"';
 const d=dday();
 const dblock=d?`<div class="dd"><span class="fn" style="--p:${d.pct||0}%" aria-label="${d.n} days">#${d.n}</span></div>${d.sub}`:'<div class="v" style="color:var(--mut)">—</div>';
 const dctl=`<div class="ddc"><input type="text" inputmode="numeric" placeholder="DD.MM.YYYY" data-dd="date" value="${esc(iso2dmy(S.dday.date))}"><button type="button" data-a="ddmode">${S.dday.mode==='until'?'UNTIL':'SINCE'}</button></div>`;
 const mv=(k,i,n)=>live()?`<br><span class="ctls ctl"><button type="button" class="xb" data-a="mv${k}" data-i="${i}" data-d="-1" aria-label="move up"${i===0?' disabled':''}>↑</button><button type="button" class="xb" data-a="mv${k}" data-i="${i}" data-d="1" aria-label="move down"${i===n-1?' disabled':''}>↓</button><button type="button" class="xb" data-a="rm${k}" data-i="${i}" aria-label="delete">×</button></span>`:'';
 const about=S.about.map((r,i)=>`<div class="rw"><span class="n">${i+1}.${mv('about',i,S.about.length)}</span><div class="c"><span class="k"${live()?' contenteditable="true"':''} data-p="about.${i}.k">${esc(r.k)}</span>${MDF(`about.${i}.v`,'v',true)}</div></div>`).join('');
 return `<div class="W p1"><aside class="L${a(0)}"><div class="id">${photo('avatar','PHOTO')}<div>${T('name','nm','h1')}${T('handle','hdl','div')}</div></div>${MDF('bio','bio')}</aside>
 <section class="Rt"><div class="blk${a(1)}"><div class="bd"><span>${T('dday.label','','span','KGA')} #${esc(iso2dmy(S.dday.date))}</span><span class="no">MOVE 1</span></div><div class="rws"><div class="rw"><span class="n">1.</span><div class="c">${dblock}${dctl}</div></div></div></div>
 <div class="blk${a(2)}"><div class="bd">${bandTxt('bands.about','ABOUT')}<span class="no">MOVE 2</span></div><div class="rws">${about}</div><button class="addb" data-a="addabout">+ ADD ROW</button></div></section>
 ${foot(an,1)}</div>`}
function titleBlock(){
 const P=S.pair,L=live();
 const part=(p,cls,tag,ph)=>L||P[p.split('.')[1]]?T(p,cls,tag,ph):'';
 const code=part('pair.code','l','div','CODE'),title=part('pair.title','t','div','Title');
 const sb=(L||P.sub)?T('pair.sub','s','div','Subtitle'):'';
 return `${code}${title}${sb}`}
function pagePair(an){
 const a=i=>an?` a" style="--i:${i}`:'"';
 const mv=(k,i,n)=>live()?`<br><span class="ctls ctl"><button type="button" class="xb" data-a="mv${k}" data-i="${i}" data-d="-1" aria-label="move up"${i===0?' disabled':''}>↑</button><button type="button" class="xb" data-a="mv${k}" data-i="${i}" data-d="1" aria-label="move down"${i===n-1?' disabled':''}>↓</button><button type="button" class="xb" data-a="rm${k}" data-i="${i}" aria-label="delete">×</button></span>`:'';
 const c0=nm(0),c1=nm(1),auto=`${U(c0)} & ${U(c1)} · CHARACTERS`;
 const spec=S.spec.map((r,i)=>`<div class="rw r3 sp3"><span class="n">${i+2}.${mv('spec',i,S.spec.length)}</span><div class="c"><span class="k"${live()?' contenteditable="true"':''} data-p="spec.${i}.k">${esc(r.k)}</span>${MDF(`spec.${i}.v.0`,'v',true)}</div><div class="c"><span class="k">${esc(r.k)}</span>${MDF(`spec.${i}.v.1`,'v',true)}</div></div>`).join('');
 const guide=S.guide.map((g,i)=>`<div class="rw"><span class="n">${i+1}.${mv('guide',i,S.guide.length)}</span><div class="c">${T(`guide.${i}.t`,'gh','h3','Title')}${MDF(`guide.${i}.b`,'gp')}</div></div>`).join('');
 return `<div class="W"><aside class="L pr${a(0)}"><div class="dg" role="img" aria-label="knight's jump diagram">${jumpSVG(ini(c0,'K'),ini(c1,'R'))}</div><div class="pt">${titleBlock()}</div></aside>
 <section class="Rt"><div class="blk rv${a(1)}" data-pin><div class="bd">${bandTxt('bands.chars',auto)}<span class="no"><span class="pin-mark">PINNED · </span>MOVE 3</span></div><div class="rws">
  <div class="hd3"><span>#</span><span>${sq(0)}${T('chars.0.hd','','span','NAME')}</span><span>${sq(1)}${T('chars.1.hd','','span','NAME')}</span></div>
  <div class="rw r3"><span class="n">1.</span><div class="c pc">${photo('chars.0.photo',esc(S.chars[0].ph||'PHOTO'))}<div class="pn">${T('chars.0.name','')}</div>${live()?`<div class="phl"><span class="k">PHOTO TEXT</span>${T('chars.0.ph','v','div','PHOTO')}</div>`:''}</div><div class="c pc">${photo('chars.1.photo',esc(S.chars[1].ph||'PHOTO'))}<div class="pn">${T('chars.1.name','')}</div>${live()?`<div class="phl"><span class="k">PHOTO TEXT</span>${T('chars.1.ph','v','div','PHOTO')}</div>`:''}</div></div>
  <div class="drop"><div class="in">${spec}<button class="addb" data-a="addspec" style="margin:0 12px 10px;width:calc(100% - 24px)">+ ADD ROW</button></div></div></div></div>
 <div class="blk${a(2)}"><div class="bd">${bandTxt('bands.guide','PAIR GUIDE')}<span class="no">MOVE 4</span></div><div class="rws">${guide}</div><button class="addb" data-a="addguide">+ ADD SECTION</button></div></section>
 ${foot(an,2)}</div>`}
function foot(an,n){
 const a=an?` a" style="--i:6`:'';
 const nav=n===1?`<a class="nx" href="#/pair">${live()?T('ui.pair','','span','PAIR'):esc(S.ui.pair||'PAIR')} <span>→</span></a>`:`<a class="nx" href="#/"><span>←</span> ${live()?T('ui.me','','span','ME'):esc(S.ui.me||'ME')}</a>`;
 const lg=`<span><button class="lg" id="lg" aria-label="login">#</button></span>`;
 const row=n===1?lg+nav:nav+lg;
 return `<footer class="ft${a}">${row}</footer><div class="lgf${lgOpen&&!logged?' on':''}" id="lgf"><form class="ug" id="uf" autocomplete="off"><input type="email" placeholder="email" aria-label="email"><input type="password" placeholder="password" aria-label="password"><button aria-label="login">→</button></form><p class="er" id="er">${esc(lgErr)}</p></div>`}
let painting=false;
function paint(an=false){
 if(painting)return;painting=true;
 document.body.classList.toggle('edit',editing);document.body.classList.toggle('prev',editing&&preview);
 $('#pv').classList.toggle('on',preview);
 document.title=SITE_TITLE;
 try{$('#app').innerHTML=page===1?pageMe(an):pagePair(an)}finally{painting=false}
}
function route(){page=/^#\/pair/.test(location.hash)?2:1;paint(true);window.scrollTo(0,0)}
function flash(m,ms=2500){$('#ebm').textContent=m;clearTimeout(ft);ft=setTimeout(()=>$('#ebm').textContent='EDIT MODE',ms)}

/* ---- load / save ---- */
const upgrade=d=>{
 const D0=DEF(),o={...D0,...d};
 o.pair={...D0.pair,...(d.pair||{})};
 if(o.pair.subCode){const sc=String(o.pair.subCode).trim(),cd=String(o.pair.code||'').trim();o.pair.code=cd?(cd.includes(sc)?cd:cd+' — '+sc):sc}
 delete o.pair.subCode;o.dday={...D0.dday,...(d.dday||{})};o.bands={...D0.bands,...(d.bands||{})};o.ui={...D0.ui,...(d.ui||{})};
 o.chars=[0,1].map(i=>{const sv=(d.chars||[])[i]||{},c={...D0.chars[i],...sv};if(sv.hd===undefined)c.hd=c.name;return c}); // header-row name is its own field (copied once from the name for old data)
 if(!Array.isArray(o.guide)){ // older versions stored intro / tags / relation / notes
  const g=d.guide||{};o.guide=[{t:'Intro',b:g.intro||''},{t:'Relation',b:[(g.tags||[]).join(' / '),g.relation||''].filter(Boolean).join('\n\n')},{t:'Notes',b:(g.notes||[]).map(x=>'- '+x).join('\n')}]}
 return o};
async function load(){
 if(!sb)return;
 const r=await sb.from('site').select('data').eq('id',1).maybeSingle();
 if(r.error){console.error(r.error);return}
 const d=r.data&&r.data.data;
 if(d&&Object.keys(d).length)S=upgrade(d);
}
async function save(){
 if(!sb){flash('DEMO — Supabase is not connected');return}
 flash('SAVING…',30000);
 try{
  const clean=JSON.parse(JSON.stringify(S));
  const r=await sb.from('site').upsert({id:1,data:clean,updated_at:new Date().toISOString()}).select();
  if(r.error)throw r.error;
  if(!r.data||!r.data.length)throw new Error('no permission (please log in again)');
  flash('SAVED ✓',3000);
 }catch(err){flash('FAILED: '+(err.message||err),6000)}
}

/* ---- events ---- */
const app=$('#app');
app.addEventListener('click',e=>{
 if(e.target.closest('#lg')){
  if(logged){editing=!editing;if(!editing)preview=false;paint();return}
  lgOpen=!lgOpen;paint();if(lgOpen){const i=$('#lgf input');i&&i.focus()}return}
 const b=e.target.closest('[data-a]');
 if(b){const a=b.dataset.a,i=+b.dataset.i;
  if(a==='addabout')S.about.push({k:'KEY',v:'value'});
  else if(a==='rmabout')S.about.splice(i,1);
  else if(a==='mvabout'||a==='mvspec'||a==='mvguide'){const arr=a==='mvabout'?S.about:a==='mvspec'?S.spec:S.guide,j=i+(+b.dataset.d);if(j>=0&&j<arr.length)[arr[i],arr[j]]=[arr[j],arr[i]]}
  else if(a==='addspec')S.spec.push({k:'KEY',v:['','']});
  else if(a==='rmspec')S.spec.splice(i,1);
  else if(a==='addguide')S.guide.push({t:'Title',b:'Text'});
  else if(a==='rmguide')S.guide.splice(i,1);
  else if(a==='ddmode')S.dday.mode=S.dday.mode==='until'?'since':'until';
  paint();return}
 if(live())return;
 const rv=e.target.closest('[data-pin]');if(rv&&!e.target.closest('a'))rv.classList.toggle('pin');
});
app.addEventListener('input',e=>{
 const t=e.target,p=t.dataset&&t.dataset.p;if(!p||!t.isContentEditable)return;
 setp(S,p,t.dataset.md?t.innerText.replace(/\u00a0/g,' ').replace(/\n$/,''):t.textContent);
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.isContentEditable&&!e.target.dataset.md){e.preventDefault();e.target.blur()}});
app.addEventListener('paste',e=>{if(e.target.isContentEditable){e.preventDefault();const raw=e.clipboardData.getData('text')||'';document.execCommand('insertText',false,e.target.dataset.md?raw:raw.replace(/\s*\n+\s*/g,' '))}});
app.addEventListener('focusout',e=>{const p=e.target.dataset&&e.target.dataset.p;if(e.target.isContentEditable&&live()&&(p==='name'||p==='chars.0.name'||p==='chars.1.name'||p==='dday.label'))setTimeout(()=>{if(live())paint()},0)});
app.addEventListener('submit',async e=>{
 e.preventDefault();
 const [m,p]=[...e.target.querySelectorAll('input')],er=$('#er');
 if(!m.value||!p.value){er.textContent='Enter email and password';return}
 if(!sb){er.textContent='Supabase is not connected';return}
 er.textContent='…';
 const {error}=await sb.auth.signInWithPassword({email:m.value.trim(),password:p.value});
 if(error){er.textContent='Login failed';return}
 logged=true;lgOpen=false;lgErr='';
 await load();editing=true;paint();
});
app.addEventListener('change',async e=>{
 const dd=e.target.closest('input[data-dd]');
 if(dd){const iso=dmy2iso(dd.value);if(iso)S.dday.date=iso;else flash('Use DD.MM.YYYY');paint();return}
 const i=e.target.closest('input[data-up]');if(!i||!i.files[0])return;
 const f=i.files[0],key=i.dataset.up;
 if(!f.type.startsWith('image/')){flash('Images only');return}
 if(f.size>5*1024*1024){flash('Max 5MB');return}
 if(!sb){setp(S,key,URL.createObjectURL(f));paint();return}
 flash('UPLOADING…',20000);
 const ext=(f.name.split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,'')||'png';
 const path=`${key.replace(/\W+/g,'-')}-${Date.now()}.${ext}`;
 const {error}=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type,cacheControl:'3600'});
 if(error){flash('UPLOAD FAILED: '+error.message,6000);return}
 setp(S,key,sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl);
 paint();flash('UPLOADED — press SAVE');
});
/* no save-image / right-click on photos, no dragging them out */
document.addEventListener('contextmenu',e=>{const t=e.target;if(t.closest&&t.closest('img,.av')&&!t.closest('[contenteditable]'))e.preventDefault()});
document.addEventListener('dragstart',e=>{if(e.target.tagName==='IMG')e.preventDefault()});
$('#sv').onclick=save;
$('#pv').onclick=()=>{preview=!preview;paint()};
$('#ex').onclick=async()=>{S=DEF();await load();editing=false;preview=false;paint()};
$('#lo').onclick=async()=>{if(sb)await sb.auth.signOut();logged=false;editing=false;preview=false;S=DEF();await load();paint()};
window.addEventListener('hashchange',route);

/* ---- start ---- */
(async()=>{
 if(SB_URL&&SB_KEY&&window.supabase){
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  try{const {data:{session}}=await sb.auth.getSession();logged=!!session;await load()}catch(err){console.error(err)}
 }
 route();
})();
</script></body></html>
